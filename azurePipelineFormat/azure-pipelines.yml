trigger:
  branches:
    include:
      - main
      - master
      - develop
      - staging

pr:
  branches:
    include:
      - main
      - master
      - develop
      - staging

parameters:
  - name: browser
    displayName: 'Seleccionar browser a ejecutar'
    type: string
    default: ' '
    values:
      - chrome
      - firefox
      - safari
      - edge
      - multipleNavegador
      - api
      - perf

  - name: folder
    displayName: 'Seleccionar folder a ejecutar'
    type: string
    default: ' '
    values:
      - ' '
      - portal

  - name: feature
    displayName: 'Seleccionar feature a ejecutar'
    type: string
    default: ' '
    values:
      - ' '
      - consultaRNC
      - AccederDGII
      - ejecucionOracle
      - ejecucionApi

  - name: tags
    displayName: 'Seleccionar tags a ejecutar'
    type: string
    default: ' '
    values:
      - ' '
      - '@smoke'
      - '@regression'
      - '@first'
      - '@smokeApi'

  - name: env
    displayName: 'Seleccionar ambiente de prueba'
    type: string
    default: 'dev'
    values:
      - ' '
      - dev
      - qa
      - prod

  - name: workers
    displayName: 'Insertar cantidad de ejecucion en workers'
    type: string
    default: ' '

  - name: data_file
    displayName: 'Seleccionar archivo de datos a ejecutar para pruebas de Performance'
    type: string
    default: ' '
    values:
      - ' '
      - apiExample

  - name: scenario
    displayName: 'Insertar el nombre del escenario a ejecutar para pruebas de Performance'
    type: string
    default: ' '

stages:
- stage: test
  jobs:
  - job: test
    timeoutInMinutes: 60

    strategy:
      matrix:
    #    macOs:
    #      poolName: 'onpremise'
    #      vmImage: 'macOs-latest'
        windows:
          poolName: 'onpremise'
          vmImage: 'windows-latest'
    #  maxParallel: 2  # Descomentar para agregar ejecucion en paralelo de multiples plataformas si existen varios agentes(hosted)

    variables:
    - group: 'ConexionBD'
    - name: BROWSER
      ${{ if eq( parameters.browser , '') }}:
        value: api
      ${{ else }}:
        value: ${{ parameters.browser }}
    - name: ENVIRONMENT
      ${{ if eq( parameters.env, '') }}:
        value: dev
      ${{ else }}:
        value: ${{ parameters.env }}
    - name: TAGS
      ${{ if eq( parameters.tags, '') }}:
        value: '@smokeApi'
      ${{ else }}:
        value: ${{ parameters.tags }}
    - name: HEADLESS
      value: true

    pool:
      name: $(poolName)
      vmImage: $(vmImage)

    steps:
      - checkout: self
        displayName: 'Clonar repositorio'

      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
        displayName: 'Configurar Node.js'

      - script: |
          npm ci
        displayName: 'Instalar dependencias de CI'

      - script: |
          npm run $(BROWSER) folder=${{ parameters.folder }} data_file=${{ parameters.data_file }} feature=${{ parameters.feature }} tags=$(TAGS) env=$(ENVIRONMENT) workers=${{ parameters.workers }} scenario=${{ parameters.scenario }}
        displayName: 'Ejecutar escenarios de prueba'
        retryCountOnTaskFailure: 2
        env:
          DB_CADENA_QASB: $(CADENA_QASB)
          DB_PASSWORD_QASB_USER: $(PASSWORD_QASB_USER)

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.SourcesDirectory)/reports/playwright-report/'
          artifactName: 'ReporteHTML-$(vmImage)'
        condition: always()
        displayName: 'Generar artefacto de Reporte HTML para $(vmImage)'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.SourcesDirectory)/reports/K6-report/'
          artifactName: 'ReporteK6-$(vmImage)'
        condition: always()
        displayName: 'Generar artefacto de Reporte K6 para $(vmImage)'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.SourcesDirectory)/logs/'
          artifactName: 'Logs-$(vmImage)'
        condition: always()
        displayName: 'Generar artefacto de logs para $(vmImage)'

      - task: PublishTestResults@2
        inputs:
          testResultsFiles: '$(Build.SourcesDirectory)/reports/temp/xml/*.xml'
          mergeTestResults: true
          testRunTitle: 'Cucumber JUnit Results'
          publishRunAttachments: true
        condition: and(always(), ne(variables['BROWSER'], 'perf'))
        displayName: 'Publicar Test Results'
